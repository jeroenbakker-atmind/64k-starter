name: build

on: [ push, pull_request ]

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: 64k-starter-windows
          path: target/release/starter.exe
          if-no-files-found: error

  macos:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Shader_Minifier only ships a Windows .exe (a Mono/.NET assembly), which
      # build.rs drives through mono on macOS.
      - name: Install mono
        run: brew install mono

      - name: Build
        run: cargo build --release

      - uses: actions/upload-artifact@v4
        with:
          name: 64k-starter-macos
          path: target/release/starter
          if-no-files-found: error