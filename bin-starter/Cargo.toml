[package]
name = "starter"
version = "0.1.0"
edition = "2021"

# The music tooling library lives in lib-song/ and is only used by the dev
# examples; the 64k executable (src/main.rs) is built from here alone.
[build-dependencies]
walkdir = "2.5"
reqwest = { version = "0.12.15", features = ["blocking"] }
# Music composition tooling — used only by build.rs to regenerate src/song.bin
# before every build. It is compiled for the host (separate from the 64k
# executable) and never linked into the final binary.
song = { path = "../lib-song" }

[target.'cfg(windows)'.dependencies.once_cell]
version = "1.21.3"
default-features = false
features = [
    "critical-section"
]

[target.'cfg(windows)'.dependencies.critical-section]
version = "1.2.0"

[target.'cfg(windows)'.dependencies.libc_alloc]
version = "1.0.7"

[target.'cfg(target_os = "macos")'.dependencies.once_cell]
version = "1.21.3"

[target.'cfg(windows)'.dependencies.wavesabre-rs]
git = "https://github.com/Kwarf/wavesabre-rs.git"

[target.'cfg(windows)'.dependencies.windows-sys]
version = "0.59.0"
default-features = false
features = [
    "Win32_Foundation",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_OpenGL",
    "Win32_System_Performance",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_WindowsAndMessaging",
]

[target.'cfg(target_os = "macos")'.dependencies]
common = { path = "../lib-common" }
wavesabre = { path = "../lib-wavesabre" }
objc = "0.2"
coreaudio-sys = "0.2"
